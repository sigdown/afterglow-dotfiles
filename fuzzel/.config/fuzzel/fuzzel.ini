[main]
font=JetBrainsMono Nerd Font:size=13
use-bold=yes

terminal=kitty -e

prompt="> "
placeholder=type to launch...

icons-enabled=no
match-mode=fzf
match-counter=yes

lines=8
width=16
horizontal-pad=24
vertical-pad=14
inner-pad=8
line-height=24

layer=overlay

[colors]
background=101A28f2
text=C8A982ff
prompt=EBC99Aff
placeholder=8F9187ff
input=EBC99Aff

match=2F8F80ff

selection=C5662Aff
selection-text=07111Fff
selection-match=07111Fff

counter=8F9187ff
border=2B3441ff

[border]
width=1
radius=4
selection-radius=0
