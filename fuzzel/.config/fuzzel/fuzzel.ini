[main]
font=JetBrainsMono Nerd Font:size=13
use-bold=yes

terminal=kitty -e

prompt="> "
placeholder=type to launch...

icons-enabled=no
match-mode=fzf
match-counter=yes

lines=8
width=16
horizontal-pad=24
vertical-pad=14
inner-pad=8
line-height=24

layer=overlay

[colors]
background=031432ff
text=e7c498ff
prompt=b3571fff
placeholder=a79682ff
input=e7c498ff

match=b3571fff

selection=268272ff
selection-text=031432ff
selection-match=e7c498ff

counter=a79682ff
border=031432ff

[border]
width=0
radius=0
selection-radius=0
