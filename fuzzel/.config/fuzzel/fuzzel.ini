[main]
font=JetBrainsMono Nerd Font:size=12
use-bold=yes

icons-enabled=yes
icon-theme=Papirus-Dark

terminal=kitty -e

prompt="> "
placeholder=type to launch...

match-mode=fzf
match-counter=yes

lines=12
width=64
horizontal-pad=24
vertical-pad=16
inner-pad=8
line-height=28

layer=overlay

[colors]
background=101A28FF
text=C8A982FF
prompt=EBC99AFF
placeholder=8F9187FF
input=EBC99AFF

match=2F8F80FF

selection=C5662AFF
selection-text=07111FFF
selection-match=07111FFF

counter=8F9187FF
border=2B3441FF

[border]
width=1
radius=10
selection-radius=4
