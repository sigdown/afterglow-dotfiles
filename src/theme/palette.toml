[colors.surface]
# Эффект глубокой тонировки: плотный темно-синий с едва уловимым циановым стеклянным подтоном
base = "#0A121D" 
raised = "#121C29"
overlay = "#192535"
hover = "#212F42"
popup = "#121C29"
alert = "#452226"

[colors.text]
# Настоящий песочный оттенок с ткани кресла, теплый и без зеленцы
primary = "#DEBFA0" 
secondary = "#B39575"
muted = "#657991"
disabled = "#455568"
on_accent = "#0d1322"

[colors.border]
subtle = "#253454"
strong = "#b55431"
focus = "#d27d46"
critical = "#c44221"

[colors.accent]
# Оттенки дерева и бирюзового океана
primary = "#C26D3B"     
secondary = "#2B8F81"   
sky = "#3CA092"
sky_soft = "#317D73"
sky_bright = "#52BDB0"

[colors.status]
success = "#2B8F81"
info = "#3CA092"
warning = "#D28E46"
critical = "#c44221"

[colors.selection]
background = "#243754"
foreground = "#DEBFA0"

[colors.cursor]
cursor = "#D27D46"
text = "#0d1322"

[colors.syntax]
# Семантика: жесткое разделение без микроотличий
comment = "#6A7C92"       # Блик на стекле (приглушенный сине-серый)
keyword = "#C76843"       # Теплое дерево (яркий рыже-коричневый)

# Классы, типы и конструкторы (Environment, FileSystemLoader)
# ОДИН И ТОТ ЖЕ цвет, чтобы вызов класса не отличался от его импорта
type = "#39A394"          # Чистый бирюзовый (океан)
constructor = "#39A394"   
builtin = "#39A394"

# Функции и методы (например, .render(), .get_template())
# Четко отличимый золотисто-песочный, чтобы не путать с классами
function = "#D28F46"
method = "#D28F46"
keyword_function = "#C76843" # def, class подсветятся как ключевые слова

# Базовые примитивы
string = "#CE7C65"        # Мягкий терракотовый
string_escape = "#E5C8A8"
number = "#DEBFA0"        
boolean = "#D28F46"
constant = "#D28F46"

# Переменные и поля
variable = "#DEBFA0"      # Базовый текст (песочный)
parameter = "#B89A7B"     # Чуть темнее песочного, чтобы отделить аргументы
property = "#8EA0B3"      # Холодный серый, чтобы свойства объектов не сливались с переменными
field = "#8EA0B3"

# Операторы и пунктуация
operator = "#C76843"
punctuation = "#6A7C92"
tag = "#39A394"
attribute = "#CE7C65"
namespace = "#8EA0B3"     # Модули (например, os, sys)
enum = "#39A394"
macro = "#C76843"
regex = "#CE7C65"
